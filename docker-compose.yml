services:
  kv-cache:
    build: .
    image: kv-block-cache:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Total number of 4-position KV blocks the process may allocate.
      MAX_BLOCKS: "${MAX_BLOCKS:-64}"
      PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
